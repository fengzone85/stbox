name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n st.sh install.sh core/*.sh modules/*.sh apps/*/app.sh tests/*.sh
      - name: UI tests
        run: bash tests/ui.sh
      - name: Script catalog tests
        run: bash tests/scripts.sh
      - name: AI module tests
        run: bash tests/ai.sh
      - name: App plugin tests
        run: bash tests/apps.sh
      - name: Menu dispatch tests
        run: bash tests/menu.sh
      - name: Config and cron tests
        run: bash tests/config.sh

  container-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["alpine:3.20", "rockylinux:9"]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test (${{ matrix.image }})
        run: |
          docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" sh -c '
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache bash >/dev/null
            fi
            bash /src/st.sh --no-color version
            bash /src/tests/ui.sh
            bash /src/tests/scripts.sh
            bash /src/tests/ai.sh
            bash /src/tests/apps.sh
            bash /src/tests/menu.sh
            bash /src/tests/config.sh
          '
